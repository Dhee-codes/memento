<!DOCTYPE html><html class="light" lang="en"><head>

                        "surface-container-low": "#fff1eb",
                        "on-surface": "#241913",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-surface": "#3a2e27",
                        "on-primary-fixed": "#331200",
                        "secondary": "#a83900",
                        "on-tertiary-container": "#453000",
                        "surface-container-lowest": "#ffffff",
                        "on-background": "#241913",
                        "on-secondary-fixed": "#380d00",

                        "tertiary-fixed": "#ffdea5",

                    "borderRadius": {

                    "spacing": {
                        "xs": "4px",
                        "sm": "12px",
                        "md": "24px",
                        "lg": "32px",
                        "base": "8px",
                        "safe-margin": "20px",
                        "xl": "48px"
                    },
                    "fontFamily": {

                        "headline-md": ["Plus Jakarta Sans"],
                        "label-sm": ["DM Sans"],
                        "body-lg": ["DM Sans"],

                    "fontSize": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #fff8f6;
            color: #241913;
            -webkit-tap-highlight-color: transparent;
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px #f47a2a;
        }
        .huggable-shadow {
            box-shadow: 0 10px 30px -10px rgba(156, 68, 0, 0.12);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Header / TopAppBar -->
<header class="flex justify-between items-center px-safe-margin h-16 w-full fixed top-0 z-50 bg-surface/80 backdrop-blur-md transition-all duration-300">
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/10 active:scale-95 transition-all text-primary">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Edit profile</h1>
<button class="px-5 py-2 bg-gradient-to-r from-primary to-secondary-container text-white rounded-full font-label-sm text-label-sm shadow-md active:scale-95 transition-all">
            Save
        </button>
</header>
<!-- Main Content -->
<main class="pt-24 pb-32 px-safe-margin max-w-md mx-auto">
<!-- Profile Picture Section -->
<section class="flex flex-col items-center mb-10">
<div class="relative group cursor-pointer active:scale-95 transition-transform duration-200">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-white huggable-shadow ring-4 ring-primary-container/5">
<img class="w-full h-full object-cover" data-alt="A warm, professional headshot of a smiling young person with soft, sun-drenched lighting. The setting is a cozy kitchen with soft-focus bakery textures in the background. The aesthetic is nostalgic and personal, with a warm color palette of honey, cream, and soft browns, perfectly matching the Memento brand's 'huggable' and sentimental atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6rQYyMl_MxdvLzOqb-3siCrysnpMOAhGFqDJZkZueza4ZMw_Bh-u98kIDz-5HxnD5BZ6hsM1r5VcmATwcG4sWbEqxl9IIduafnpOytr5Wb11FCAd4fDH8WhUy-YPgnm0LOihbRJ-GUms2iMmas6dcwZ_ajdn-lNqSVlesvjeZWiqG3bLwV1TU9idPO3iBBXNF1ZZVMeRL8w0Rb6i_SzfqprThVjWhGRq0YTTYI-MoKyGo4MR7Y9BqDA">
</div>
<!-- Tap to change overlay -->
<div class="absolute inset-0 bg-black/30 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-white text-3xl" data-icon="photo_camera">photo_camera</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-2 border-white">
<span class="material-symbols-outlined text-xl" data-icon="edit">edit</span>
</div>
</div>
<p class="mt-4 font-label-sm text-label-sm text-primary tracking-wide">TAP TO CHANGE PHOTO</p>
</section>
<!-- Form Fields -->
<form class="space-y-6">
<!-- Name Field -->
<div class="group">
<label class="block mb-2 font-label-sm text-label-sm text-on-surface-variant ml-1" for="full_name">
                    Full Name
                </label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary-container transition-all huggable-shadow placeholder:text-outline" id="full_name" placeholder="Your name" type="text" value="Gifthie Cuisine">
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/40" data-icon="person">person</span>
</div>
</div>
<!-- Email Field -->
<div class="group">
<label class="block mb-2 font-label-sm text-label-sm text-on-surface-variant ml-1" for="email_address">
                    Email Address
                </label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary-container transition-all huggable-shadow placeholder:text-outline" id="email_address" placeholder="yourname@example.com" type="email" value="hello@gifthiecuisine.com">
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/40" data-icon="mail">mail</span>
</div>
</div>
<!-- Phone Number Field -->
<div class="group">
<label class="block mb-2 font-label-sm text-label-sm text-on-surface-variant ml-1" for="phone_number">
                    Phone Number
                </label>
<div class="relative">
<input class="w-full h-14 px-5 bg-surface-container-low border-none rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary-container transition-all huggable-shadow placeholder:text-outline" id="phone_number" placeholder="+1 (000) 000-0000" type="tel" value="+1 (555) 000-2026">
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/40" data-icon="call">call</span>
</div>
<p class="mt-2 ml-1 font-label-sm text-[11px] text-on-surface-variant/70 italic flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                    Used so we can reach you about your orders
                </p>
</div>
<!-- Action Divider (Stylistic Scrapbook Touch) -->
<div class="py-6 flex items-center gap-4">
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
<span class="material-symbols-outlined text-primary/30" data-icon="auto_awesome">auto_awesome</span>
<div class="h-[1px] flex-grow bg-outline-variant/30"></div>
</div>
<!-- Account Security Section -->
<div class="bg-white/40 p-4 rounded-xl border border-outline-variant/20 flex items-center justify-between group active:bg-surface-container transition-colors cursor-pointer">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-tertiary-container/10 flex items-center justify-center text-tertiary">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<div>
<h3 class="font-label-sm text-label-sm text-on-surface">Change Password</h3>
<p class="text-[11px] text-on-surface-variant">Last changed 3 months ago</p>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</form>
<!-- Danger Zone -->
<button class="w-full mt-12 py-4 flex items-center justify-center gap-2 text-error font-label-sm text-label-sm opacity-60 hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-lg" data-icon="delete">delete</span>
            DELETE ACCOUNT
        </button>
</main>
<!-- Navigation suppressed per "Task-Focused" exclusion rule -->
<script>
        // Micro-interactions for form fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });

        // Floating Header Effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm');
                header.classList.remove('bg-surface/80');
                header.classList.add('bg-surface');
            } else {
                header.classList.remove('shadow-sm');
                header.classList.add('bg-surface/80');
                header.classList.remove('bg-surface');
            }
        });
    </script>
</body></html>
