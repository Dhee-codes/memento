<style>
        body {
            background-color: #fff8f6;
            color: #241913;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .slot-shadow {
            box-shadow: 0 4px 15px rgba(156, 68, 0, 0.08);
        }
        input:focus, textarea:focus {

        }

            width: 4px;

        .custom-scrollbar::-webkit-scrollbar-thumb {

        }

    body {
      min-height: max(884px, 100dvh);

<body class="font-body-md min-h-screen flex flex-col items-center">
<!-- Top App Bar -->
<header class="fixed top-0 z-50 w-full max-w-md h-16 px-safe-margin bg-surface/90 backdrop-blur-md flex justify-between items-center shadow-sm">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/10 transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Edit memory</h1>
<button class="px-4 py-2 rounded-full font-label-sm text-label-sm bg-primary/40 text-on-primary cursor-not-allowed transition-all" disabled="">
            Save
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-md pt-24 pb-32 px-safe-margin flex flex-col gap-lg">
<!-- Form Section: Title -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 uppercase tracking-widest" for="title">Title</label>
<input class="w-full h-14 px-md bg-surface-container-low border-none rounded-lg font-body-lg text-body-lg text-on-surface slot-shadow placeholder-on-surface-variant/40" id="title" placeholder="Name your memory..." type="text" value="Graduation Brunch">
</div>
<!-- Form Section: Description -->
<div class="flex flex-col gap-base">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 uppercase tracking-widest" for="description">Description</label>
<textarea class="w-full p-md bg-surface-container-low border-none rounded-lg font-body-md text-body-md text-on-surface slot-shadow resize-none placeholder-on-surface-variant/40 custom-scrollbar" id="description" placeholder="Tell the story of this moment..." rows="4">Celebrating Sarah's big day with the best pastries in town.</textarea>
</div>
<!-- Media Section: Your View -->
<div class="flex flex-col gap-md">
<div class="flex flex-col gap-xs">
<h2 class="font-headline-md text-headline-md text-on-surface">Your view</h2>
<p class="font-label-sm text-label-sm text-on-surface-variant">Photos or videos, up to 30 seconds.</p>
</div>
<!-- Bento-style Grid for Media -->
<div class="grid grid-cols-3 gap-sm">
<!-- Slot 1: Existing Photo -->
<div class="relative aspect-square rounded-lg overflow-hidden slot-shadow group transition-transform active:scale-[0.98]">
<div class="w-full h-full bg-cover bg-center" data-alt="A bright, sun-drenched close-up photo of a gourmet flaky croissant and a colorful fruit tart on a rustic white ceramic plate. The lighting is warm and golden, reflecting a celebratory morning brunch atmosphere. The soft-focus background shows a hint of a vibrant floral arrangement in a light-mode scrapbook aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAYX9mP9wPRCaw_ii9l3SmpQWa113itMbsPHJribIhJGms8fxNNpqIxZoc8vcyp4dFrvoVXZMWncsGPotp9NOmxRv6lbr9tZE0TpJRWY6pNXntvrddjJea_fNToW76cvFj2JHHhRXdvEMuaqo0E4OvIZHXD64wiJrWIjiSJa-LQlSotzEeG1dKmK64osopy6ons4bhzG_M8hp1LW97kw5VawtHVTV9rdrpwllj8hmCUpqj7NkW_RZCMtw')"></div>
<button class="absolute top-1 right-1 w-7 h-7 bg-on-surface/60 backdrop-blur-sm rounded-full flex items-center justify-center text-white hover:bg-error transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Slot 2: Existing Photo -->
<div class="relative aspect-square rounded-lg overflow-hidden slot-shadow group transition-transform active:scale-[0.98]">
<div class="w-full h-full bg-cover bg-center" data-alt="A joyful group candid photo of three young adults laughing around a cafe table. One person is wearing a graduation sash. The scene is bathed in natural daylight, with high-key airy tones and soft orange accents that match a warm, nostalgic brand palette. The composition feels personal and intimate, like a physical scrapbook memory." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDRtRl_rRIu825X31BB_lJdUSVNR4w68vNYuctl449HyqSCl0qX470PVOYbcl1BeeBHMGhoA-7ZG7CPThwt94DGQ-pp14m6icCJLU6FLLsFCPngw1OCOXI7bNVpEqEjI4GlG-aHBChfLn1W3yqsdPXkc5NYyJ5vNH7iVaOU6m0uM1UQ3bCoMb128_v7c4mm4wp2ZkEmXH0HROPn3pS-zsjpd9bp-o_-jKnXO_3hRVq8jaj0D6wDS3BGlw')"></div>
<button class="absolute top-1 right-1 w-7 h-7 bg-on-surface/60 backdrop-blur-sm rounded-full flex items-center justify-center text-white hover:bg-error transition-colors">
<span class="material-symbols-outlined text-[18px]">close</span>
</button>
</div>
<!-- Slot 3: Empty Add Slot -->
<button class="relative aspect-square border-2 border-dashed border-outline-variant bg-surface-container-low rounded-lg flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:bg-surface-container transition-colors active:scale-95 group">
<span class="material-symbols-outlined text-primary text-[32px] group-hover:scale-110 transition-transform">photo_camera</span>
<span class="font-label-sm text-[10px] text-center px-1">Add photo or video</span>
</button>
</div>
</div>
<!-- Decorative Sentiment Accent -->
<div class="mt-4 py-md border-t border-surface-container-highest flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">favorite</span>
<p class="font-accent-script text-accent-script text-secondary opacity-80 italic">A moment to keep forever...</p>
</div>
</main>
<!-- Bottom Navigation Shell (Filtered for transactional relevance - using as a footer check but typically suppressed on edit screens. Here we keep a minimal brand footprint) -->
<footer class="fixed bottom-0 w-full max-w-md bg-surface/90 backdrop-blur-md px-safe-margin py-4 flex justify-center items-center shadow-[0_-4px_20px_rgba(156,68,0,0.08)]">
<div class="flex items-center gap-2">
<span class="font-display-chunky text-[16px] text-primary">Memento</span>
<span class="w-1 h-1 bg-outline-variant rounded-full"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Baking memories since 2026</span>
</div>
</footer>
<script>
        // Micro-interaction for the Save button state
        const titleInput = document.getElementById('title');
        const descInput = document.getElementById('description');
        const saveBtn = document.querySelector('header button:last-child');

        const checkChanges = () => {
            const initialTitle = "Graduation Brunch";
            const initialDesc = "Celebrating Sarah's big day with the best pastries in town.";
            
            if (titleInput.value !== initialTitle || descInput.value !== initialDesc) {
                saveBtn.classList.remove('bg-primary/40', 'cursor-not-allowed');
                saveBtn.classList.add('bg-primary', 'hover:shadow-lg', 'active:scale-95');
                saveBtn.disabled = false;
            } else {
                saveBtn.classList.add('bg-primary/40', 'cursor-not-allowed');
                saveBtn.classList.remove('bg-primary', 'hover:shadow-lg', 'active:scale-95');
                saveBtn.disabled = true;
            }
        };

        titleInput.addEventListener('input', checkChanges);
        descInput.addEventListener('input', checkChanges);

        // Visual feedback on media slots
        document.querySelectorAll('.aspect-square button').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const container = btn.closest('.aspect-square');
                container.style.opacity = '0';
                container.style.transform = 'scale(0.8)';
                setTimeout(() => {
                    // In a real app, this would remove the element or reset to empty slot
                    container.classList.add('hidden');
                }, 300);
            });
        });
    </script>
</body></html>
