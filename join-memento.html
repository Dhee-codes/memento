                "on-primary-container": "#592400",

                "tertiary-container": "#be9648",
                "outline-variant": "#dec0b2",
                "surface-container-highest": "#f4ded4",
                "on-background": "#241913",
                "inverse-on-surface": "#ffede5",
                "secondary-fixed": "#ffdbcf",

                "on-secondary-fixed": "#380d00",

                "on-error": "#ffffff",

<style>
        body {
            background-color: #fff8f6; /* surface-bright */
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .squishy-active:active {
            transform: scale(0.96);
        }
        /* Custom focused state for scrapbook-feel inputs */
        .focus-ring:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(244, 122, 42, 0.2);
            border-color: #f47a2a;
        }
    </style>

<body class="font-body-md text-on-surface flex items-center justify-center min-h-screen p-safe-margin overflow-x-hidden">
<!-- Background Subtle Texture -->
<div class="fixed inset-0 pointer-events-none opacity-[0.03] z-0" style="background-image: radial-gradient(#9c4400 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
<main class="w-full max-w-md flex flex-col items-center justify-center z-10 space-y-lg">
<!-- Top: Logo Section -->
<div class="flex flex-col items-center space-y-md animate-fade-in-up">
<div class="w-20 h-20 flex items-center justify-center">
<img alt="Memento Ring Mark" class="w-full h-auto object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6X3HPJm0POQ4QIPMOorFoOodKrnGwxgJ3YLpP38B8y9e47DGjY7hAP8YhcC9hgLWP8SoWYurdV0JBi8d_JfDxrlA_7lY09D11I1bXCHkRiQTiNYCWG92VrhRbZBBq3zGNNI4hdbkBhSIGd2zEr89BDPi-SgQXNUdvWMH1kstQR9sRm5FuTtr5j-CSMq-UIcF-Z8i1r8fnJBSbHR34Llbx3WfdDCsWENG1IfzjYlTZRXamgJpl7YCJAWa8kRwOkR9q4Go">
</div>
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-primary tracking-tight">
                    Let's start your memory lane
                </h1>
<p class="font-body-md text-on-surface-variant mt-xs px-md opacity-80">
                    Baking memories since 2026. Join our culinary scrapbook.
                </p>
</div>
</div>
<!-- Form Section -->
<section class="w-full bg-surface-container-lowest rounded-lg p-md shadow-sm border border-surface-container-high space-y-md">
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Name Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base" for="name">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-DEFAULT font-body-md text-on-surface placeholder:text-outline/50 focus-ring transition-all" id="name" placeholder="John Doe" type="text">
</div>
</div>
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-DEFAULT font-body-md text-on-surface placeholder:text-outline/50 focus-ring transition-all" id="email" placeholder="hello@cuisine.com" type="email">
</div>
</div>
<!-- Password Field (Implied necessity for sign up) -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-base" for="password">Create Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low border-none rounded-DEFAULT font-body-md text-on-surface placeholder:text-outline/50 focus-ring transition-all" id="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Sign Up Button -->
<button class="w-full h-14 bg-gradient-to-r from-primary to-secondary-container text-white font-headline-md text-headline-md rounded-full shadow-lg squishy-active transition-all flex items-center justify-center space-x-base mt-lg" type="submit">
<span>Sign up</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</section>
<!-- Footer Section -->
<footer class="flex flex-col items-center space-y-md w-full pt-md">
<p class="font-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-bold hover:underline transition-all" href="#">Log in</a>
</p>
<!-- Decorative Element: Warm Divider -->
<div class="flex items-center w-3/4 opacity-20">
<div class="flex-1 h-px bg-primary"></div>
<div class="mx-md">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="flex-1 h-px bg-primary"></div>
</div>
<!-- Social Proof / Trust (Optional but adds to the scrapbook warm aesthetic) -->
<p class="font-label-sm text-label-sm text-outline tracking-wider uppercase text-center opacity-60">
                Your memories are safely stored &amp; encrypted
            </p>
</footer>
</main>
<!-- Micro-interaction Scripts -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });

        // Simple button press effect enhancement
        const btn = document.querySelector('button');
        btn.addEventListener('mousedown', () => btn.classList.add('scale-95'));
        btn.addEventListener('mouseup', () => btn.classList.remove('scale-95'));
        btn.addEventListener('mouseleave', () => btn.classList.remove('scale-95'));
    </script>
</body></html>
