<!DOCTYPE html><html class="light" lang="en"><head>

                    "DEFAULT": "1rem",

            "spacing": {
                    "xl": "48px",
                    "md": "24px",
                    "base": "8px",
                    "xs": "4px",
                    "sm": "12px",
                    "safe-margin": "20px",
                    "lg": "32px"
            },
            "fontFamily": {
                    "headline-md": ["Plus Jakarta Sans", "sans-serif"],
                    "label-sm": ["DM Sans", "sans-serif"],
                    "body-lg": ["DM Sans", "sans-serif"],

<style>
        body {
            background-color: #fff8f6;
            color: #241913;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .honey-glaze-gradient {
            background: linear-gradient(135deg, #f47a2a 0%, #ff6a2a 100%);
        }
        .scrapbook-shadow {
            box-shadow: 0 15px 35px -5px rgba(156, 68, 0, 0.08);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="font-body-md selection:bg-primary-container/30">
<!-- Top App Bar -->
<header class="flex justify-between items-center px-safe-margin h-16 w-full fixed top-0 z-50 bg-surface dark:bg-surface-container-highest shadow-sm">
<div class="flex flex-col">
<h1 class="font-display-chunky text-[24px] text-primary dark:text-primary-fixed-dim leading-none">Memory Lane</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant opacity-80">Every moment, in order.</p>
</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-primary-container/10 transition-colors">
<span class="material-symbols-outlined text-primary">search</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border-2 border-primary/10">
<img class="w-full h-full object-cover" data-alt="A professional and friendly user profile headshot, styled as a soft-focus portrait with warm, golden-hour natural lighting. The character is smiling warmly against a blurred background of a cozy bakery with rustic wooden shelves and amber-toned lights. The overall aesthetic is personal and inviting, matching the warm scrapbook theme of the app with rich, earthy color tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuD2RwXHqs6OIIfrmt2Ou1uOC7YQYE2X0rtaYsIt6H3oooXNdMqjVrpnvLchKoQbwBlPaA6-acICwMs5RkTKeTgemw0R2BewM8G7TrKboWNcp1MV7jsPxf0oo2J217cy0WE6OfMFh6-XRjDffJ3PCUMaYaGRkbSn-3ChUA4RQMhBkfYC5bHdmw_GC033eBEreI-LgRJbpxKKNVAcm8x8bxupz79603FAeg2mJy7Bm3ED9T0fSWWOof9C-g">
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-32 px-safe-margin min-h-screen flex flex-col items-center justify-center text-center">
<!-- Empty State Container -->
<div class="max-w-sm w-full space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Illustration Area -->
<div class="relative flex justify-center items-center">
<div class="absolute inset-0 bg-primary-container/5 rounded-full blur-3xl transform scale-150"></div>
<div class="relative w-48 h-48 animate-float">
<img alt="Gifthie's Cuisine Mark" class="w-full h-full object-contain opacity-90 drop-shadow-2xl filter sepia-[0.2]" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUcfBYKmx1OaeJQGcUA_vC8LJ0JwBZY1y1-ErKMq5e9xweay-6OHj3zrQoWvqZoHKzTdncNrO9TUA8pXLxEFTnFJ_KuQ8GWnBMxEgPzZHpRIJzlHk0TtiH7G9WSJEsnSOPb7hPc-oU5Wpc6jv1NGG2sIoxLXDsp-wtZbTXcMWPTuyV3huLxE3pucG_bKHsGlfTMp3DB3ie9WOkhVNVzomWmz1lN3KdoCSROfRNbKd-7CnaqfaXZf5TLZEfRECRaeR068Q">
<!-- Decorative Elements -->
<div class="absolute -top-4 -right-4 w-12 h-12 bg-tertiary-fixed rounded-full flex items-center justify-center scrapbook-shadow rotate-12">
<span class="material-symbols-outlined text-tertiary text-xl" style="font-variation-settings: 'FILL' 1;">star</span>
</div>
<div class="absolute -bottom-2 -left-4 w-10 h-10 bg-secondary-fixed rounded-lg flex items-center justify-center scrapbook-shadow -rotate-6">
<span class="material-symbols-outlined text-secondary text-lg" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="space-y-4">
<h2 class="font-display-chunky text-display-chunky text-on-surface">No memories yet</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto">
                    Your culinary scrapbook is waiting. Place an order to start your first memory.
                </p>
</div>
<!-- CTA -->
<div class="pt-4 flex flex-col items-center gap-4">
<button class="honey-glaze-gradient text-on-primary font-headline-md text-headline-md px-10 py-4 rounded-full scrapbook-shadow active:scale-95 transition-all duration-200 w-full md:w-auto">
                    Order now
                </button>
<button class="text-primary font-label-sm text-label-sm flex items-center gap-2 hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined">auto_stories</span>
                    Browse Sample Scrapbook
                </button>
</div>
</div>
<!-- Atmospheric Background Element (Floating "Scraps") -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-20">
<div class="absolute top-1/4 -left-10 w-32 h-32 border-4 border-primary/10 rounded-xl rotate-12"></div>
<div class="absolute bottom-1/4 -right-10 w-40 h-40 bg-secondary-container/5 rounded-full"></div>
<div class="absolute top-1/3 right-10 w-8 h-8 border-2 border-tertiary/20 rounded-full"></div>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-2 py-3 pb-safe bg-surface/90 dark:bg-surface-container-high/90 backdrop-blur-md shadow-[0_-4px_20px_rgba(156,68,0,0.08)] rounded-t-lg">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80" href="#">
<span class="material-symbols-outlined text-[24px]">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</a>
<!-- Active Tab: Memories -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 scale-100 transition-all duration-200" href="#">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">auto_stories</span>
<span class="font-label-sm text-label-sm mt-0.5">Memories</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80" href="#">
<span class="material-symbols-outlined text-[24px]">shopping_bag</span>
<span class="font-label-sm text-label-sm mt-1">Order</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80" href="#">
<span class="material-symbols-outlined text-[24px]">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</a>
</nav>
<script>
        // Simple micro-interaction for the CTA button
        const cta = document.querySelector('.honey-glaze-gradient');
        cta.addEventListener('touchstart', () => {
            cta.style.transform = 'scale(0.95)';
        });
        cta.addEventListener('touchend', () => {
            cta.style.transform = 'scale(1)';
        });

        // Entrance animation orchestration
        window.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.animate-in');
            items.forEach((el, index) => {
                el.style.animationDelay = `${index * 150}ms`;
            });
        });
    </script>
</body></html>
